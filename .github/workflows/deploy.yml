name: Deploy to AWS

# Trigger: every push to main triggers a production deploy.
# Frontend rebuild + S3 sync + CloudFront invalidate (parallel with backend
# SSM deploy). OIDC for AWS auth (no long-lived secrets in GitHub).

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger from GitHub UI

# Required for aws-actions/configure-aws-credentials@v4 to assume role via OIDC.
# contents: write is required by the Tag release step (gh release create).
permissions:
  id-token: write
  contents: write

# Cancel any in-progress run for the same branch when a new commit is pushed
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy frontend (S3+CF) + backend (EC2 via SSM)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://portafolio.srozas.men

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----- Frontend build -----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: apps/web

      - name: Build frontend
        # PUBLIC_API_URL is REQUIRED at build time; without it the Chatbot
        # bundle bakes in the fallback "http://localhost:8000" and breaks
        # end-to-end chat. See docs/deploy/aws.md gotchas section.
        run: PUBLIC_API_URL=https://api.portafolio.srozas.men npm run build
        working-directory: apps/web

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::467640459757:role/github-actions-deploy
          aws-region: us-west-2

      - name: Verify EC2 instance is reachable (sanity)
        run: |
          aws ec2 describe-instances \
            --instance-ids i-04b4296febfda434a \
            --query 'Reservations[].Instances[].[State.Name,PublicIpAddress]' \
            --output table

      - name: Deploy frontend to S3
        # --delete drops old placeholder/assets not in dist/.
        # Then re-upload index.html with Cache-Control: max-age=300 so deploys
        # take effect fast at the CDN edge.
        run: |
          aws s3 sync apps/web/dist/ s3://portafolio-web-prod/ --delete
          aws s3 cp apps/web/dist/index.html \
            s3://portafolio-web-prod/index.html \
            --cache-control "max-age=300" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation \
          --distribution-id EJ12TBQTYJ43D \
          --paths "/*"

      # ----- Backend deploy via SSM -----
      - name: Deploy backend (capture prev + pull + restart + health check)
        id: deploy
        # Atomic: capture prev SHA, porcelain guard, pull --ff-only, pip install,
        # restart, sleep, is-active, health curl. set -euo pipefail aborts on any
        # failure. prev_sha is exposed as step output for the rollback step.
        run: |
          CMD=$(aws ssm send-command \
            --instance-ids i-04b4296febfda434a \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "set -euo pipefail",
              "cd /opt/portafolio",
              "PREV=$(git rev-parse HEAD)",
              "echo \\"Previous commit: $PREV\\"",
              "[ -z \\"$(git status --porcelain)\\" ] || { echo \\"ERROR: EC2 has uncommitted changes, aborting\\"; git status --porcelain; exit 1; }",
              "git pull --ff-only origin main",
              "pip install -r apps/api/requirements.txt --quiet",
              "sudo systemctl restart portafolio.service",
              "sleep 3",
              "sudo systemctl is-active portafolio.service",
              "HEALTH=$(curl -sS -m 5 http://127.0.0.1:8000/api/health || true)",
              "echo \\"$HEALTH\\" | grep -q \\\\"status\\\\":\\\\"ok\\\\" || { echo \\\\"HEALTH FAILED: $HEALTH\\\\"; exit 1; }",
              "echo \\\\"DEPLOY OK\\\\""
            ]' \
            --comment "Deploy: capture prev, pull, restart, health check" \
            --query 'Command.CommandId' \
            --output text)
          aws ssm wait command-executed --command-id "$CMD" || true
          OUT=$(aws ssm get-command-invocation \
            --command-id "$CMD" \
            --query 'StandardOutputContent' \
            --output text)
          PREV_SHA=$(echo "$OUT" \
            | grep -oP 'Previous commit: \K[0-9a-f]+' \
            | head -1)
          echo "Captured previous commit SHA: $PREV_SHA"
          echo "prev_sha=$PREV_SHA" >> "$GITHUB_OUTPUT"

      - name: Rollback on deploy failure
        if: failure() && steps.deploy.outputs.prev_sha
        # Runs only if deploy failed AND we captured a prev_sha.
        # git reset --hard here is intentional: this is an explicit recovery
        # operation, not the normal pull path (which uses --ff-only).
        run: |
          PREV="${{ steps.deploy.outputs.prev_sha }}"
          CMD=$(aws ssm send-command \
            --instance-ids i-04b4296febfda434a \
            --document-name AWS-RunShellScript \
            --parameters "commands=[
              \"set -euo pipefail\",
              \"cd /opt/portafolio\",
              \"git reset --hard $PREV\",
              \"pip install -r apps/api/requirements.txt --quiet\",
              \"sudo systemctl restart portafolio.service\",
              \"sleep 3\",
              \"sudo systemctl is-active portafolio.service\",
              \"HEALTH=$(curl -sS -m 5 http://127.0.0.1:8000/api/health || true)\",
              \"echo \\\"$HEALTH\\\" | grep -q \\\\\\\"status\\\\\\\":\\\\\\\"ok\\\\\\\" || { echo \\\\\\\"ROLLBACK HEALTH FAILED: $HEALTH\\\\\\\"; exit 1; }\",
              \"echo \\\\\\\"ROLLED BACK TO $PREV\\\\\\\"\"
            ]" \
            --comment "GitHub Actions rollback: reset to $PREV and restart" \
            --query 'Command.CommandId' \
            --output text)
          aws ssm wait command-executed --command-id "$CMD"
          echo "Rollback command issued"

      - name: Notify on failure
        if: failure()
        continue-on-error: true
        # Sends a generic webhook payload to DEPLOY_WEBHOOK_URL (Slack-compatible
        # {text: ...}). Silently skips if the secret is unset. continue-on-error
        # + || true ensure notification failure doesn't cascade. ROLLBACK_STATUS
        # is built in bash (GH Actions `+` is arithmetic-only, not string concat).
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          PREV_SHA: ${{ steps.deploy.outputs.prev_sha }}
          RUN_URL: >-
            ${{ github.server_url
            }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          AUTHOR: ${{ github.actor }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL not configured, skipping notification"
            exit 0
          fi
          if [ -n "$PREV_SHA" ]; then
            ROLLBACK_STATUS="Auto-rollback attempted to ${PREV_SHA}"
          else
            ROLLBACK_STATUS="No rollback (deploy never started)"
          fi
          jq -n \
            --arg text ":rotating_light: Deploy to production FAILED." \
            --arg commit "$COMMIT" \
            --arg author "$AUTHOR" \
            --arg run_url "$RUN_URL" \
            --arg rollback "$ROLLBACK_STATUS" \
            '{text: ($text
                + "\n\nCommit: " + $commit
                + "\nAuthor: " + $author
                + "\nRun: " + $run_url
                + "\nRollback: " + $rollback)}' \
            > /tmp/deploy-notify.json
          curl -sS --max-time 10 -X POST -H "Content-Type: application/json" \
            --data @/tmp/deploy-notify.json \
            "$DEPLOY_WEBHOOK_URL" || echo "Notification failed (non-blocking)"

      - name: Tag release
        if: success()
        # Creates a timestamped git tag + GitHub release on every successful
        # deploy. Uses gh release create (one API call, no git push needed).
        # Tag format: deploy-YYYYMMDDTHHMMSSZ-<short-sha> — sortable + readable.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="$(date -u +%Y%m%dT%H%M%SZ)-${SHORT_SHA}"
          MSG="Deploy $(date -u +%Y-%m-%dT%H:%M:%SZ) by ${{ github.actor }}."
          gh release create "$TAG" \
            --title "Deploy ${SHORT_SHA}" \
            --notes "$MSG" \
            --target "$GITHUB_SHA"
