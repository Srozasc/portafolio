name: CI

# Trigger: every PR (opened/synchronize/reopened) targeting any branch,
# plus every push to any branch EXCEPT main (main deploys via deploy.yml).
# This gives us a lint+test gate on PRs without colliding with the
# deploy workflow (which only runs on push to main).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore:
      - main

# Read-only token is enough: no AWS auth happens here.
permissions:
  contents: read

# Cancel stale runs on the same ref so reruns don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + test (backend + frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      # ----- Backend -----
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: apps/api

      - name: Ruff lint (backend)
        run: ruff check .
        working-directory: apps/api

      - name: Ruff format check (backend)
        run: ruff format --check .
        working-directory: apps/api

      - name: Pytest (backend)
        # Test-only env-var defaults matching apps/api/tests/conftest.py::setup_test_env.
        # These are stubs (localhost LLMs, test data dirs) — no real secrets.
        env:
          LLM_BASE_URL: http://localhost:1234/v1
          LLM_API_KEY: not-needed
          CHAT_MODEL: local-model
          EMBEDDING_BASE_URL: http://localhost:1234/v1
          EMBEDDING_API_KEY: not-needed
          EMBEDDING_MODEL: text-embedding-nomic-embed-text-v1.5
          DATA_DIR: ./data
          CHROMA_PERSIST_DIR: ./data/chroma
          CHUNK_SIZE: '700'
          CHUNK_OVERLAP: '150'
          TOP_K: '4'
          SIMILARITY_THRESHOLD: '0.75'
          MAX_INGEST_BYTES: '5242880'
          APP_HOST: 127.0.0.1
          APP_PORT: '8000'
          CORS_ALLOW_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
        run: pytest tests/ -x
        working-directory: apps/api

      # ----- Frontend -----
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web

      - name: Astro check (frontend)
        # npm run check = astro check (typecheck + diagnostics)
        run: npm run check
        working-directory: apps/web
